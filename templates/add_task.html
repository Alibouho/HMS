{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-2 p-3 bg-primary-subtle text-dark">
    <h1 class="text-center">Add Task Page</h1>
</div>

<form method="POST">
    <div class="mb-3">
        <label>Task Title</label>
        <input type="text" name="task_title" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Description</label>
        <input type="text" name="description" class="form-control">
    </div>

    <div class="mb-3">
        <label>Assigned Date</label>
        <input type="date" name="assigned_date" class="form-control">
    </div>

    <div class="mb-3">
        <label>Status</label>
        <input type="text" name="status" class="form-control">
    </div>

    <button type="submit" class="btn btn-success">Add Task</button>
</form>

{% endblock %}
