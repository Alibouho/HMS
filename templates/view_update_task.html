{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-2 p-3 bg-primary-subtle text-dark">
    <h1 class="text-center">View & Update Task Page</h1>
</div>


<table class="table table-bordered table-striped">
    <tr>
        <th>ID</th>
        <th>Task Title</th>
        <th>Description</th>
        <th>Assigned Date</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for task in tasks %}
    <tr>
        <td>{{ task.id }}</td>
        <td>{{ task.task_title }}</td>
        <td>{{ task.description }}</td>
        <td>{{ task.assigned_date }}</td>
        <td>{{ task.status }}</td>
        <td>
            <a href="{{ url_for('task.edit_task', id=task.id) }}" class="btn btn-warning btn-sm">Edit</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
