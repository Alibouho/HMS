{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-2 p-3 bg-primary-subtle text-dark">
    <h1 class="text-center">Edit Medicine Page</h1>
</div>

<form method="POST">
    <div class="mb-3">
        <label>Medicine Name</label>
        <input type="text" name="medicine_name" class="form-control" value="{{ medicine.medicine_name }}" required>
    </div>

    <div class="mb-3">
        <label>Category</label>
        <input type="text" name="category" class="form-control" value="{{ medicine.category }}">
    </div>

    <div class="mb-3">
        <label>Quantity</label>
        <input type="number" name="quantity" class="form-control" value="{{ medicine.quantity }}">
    </div>

    <div class="mb-3">
        <label>Price</label>
        <input type="number" step="0.01" name="price" class="form-control" value="{{ medicine.price }}">
    </div>

    <div class="mb-3">
        <label>Expiry Date</label>
        <input type="date" name="expiry_date" class="form-control" value="{{ medicine.expiry_date }}">
    </div>

    <button type="submit" class="btn btn-success">Update Medicine</button>
    <a href="{{ url_for('medicine.view_update_medicine') }}" class="btn btn-secondary">Back</a>
</form>

{% endblock %}
