{% extends "base.html" %}

{% block content %}

<div class="container-fluid mt-2 p-3 bg-primary-subtle text-dark">
    <h1 class="text-center">Edit Patient Bill Page</h1>
</div>

<form method="POST">
    <div class="mb-3">
        <label>Amount</label>
        <input type="number" step="0.01" name="amount" class="form-control" value="{{ bill.amount }}" required>
    </div>

    <div class="mb-3">
        <label>Bill Date</label>
        <input type="date" name="bill_date" class="form-control" value="{{ bill.bill_date }}">
    </div>

    <div class="mb-3">
        <label>Payment Status</label>
        <input type="text" name="payment_status" class="form-control" value="{{ bill.payment_status }}">
    </div>

    <button type="submit" class="btn btn-success">Update Bill</button>
    <a href="{{ url_for('billing.view_update_patient_bill') }}" class="btn btn-secondary">Back</a>
</form>

{% endblock %}
