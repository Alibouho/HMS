{% extends "base.html" %}

{% block content %}
<div class="container-fluid mt-2 p-3 bg-primary-subtle text-dark">
    <h1 class="text-center">Add Patient Page</h1>
</div>

<form method="POST">
    <div class="mb-3">
        <label>Amount</label>
        <input type="number" name="amount" class="form-control">
    </div>

    <div class="mb-3">
        <label>Date</label>
        <input type="date" name="bill_date" class="form-control">
    </div>

    <div class="mb-3">
        <label>Status</label>
        <input type="text" name="payment_status" class="form-control">
    </div>

    <button type="submit" class="btn btn-success">Add Bill</button>
</form>

{% endblock %}
