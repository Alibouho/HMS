{% extends "base.html" %}

{% block content %}
<div class="container-fluid mt-2 p-3 bg-primary-subtle text-dark">
    <h1 class="text-center">Add Patient Page</h1>
</div>
<form method="POST">

    <div class="mb-2">
        <label>Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="mb-2">
        <label>Age</label>
        <input type="number" name="age" class="form-control" required>
    </div>

    <div class="mb-2">
        <label>Phone</label>
        <input type="number" name="phone" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Address</label>
        <input type="text" name="address" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success">Save</button>

</form>
{% endblock %}
